<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feira de Adoção - Campo Largo (ODS 15)</title>
    <!-- Bootstrap 5.3 CDN para acessibilidade e responsividade -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .filter-btn { min-height: 48px; min-width: 48px; } /* RNF04: Alvos de toque otimizados */
    </style>
</head>
<body class="bg-light">
    <main class="container py-4">
        <header class="mb-4">
            <h1 class="h3">FEIRA DE ADOÇÃO CL Voluntário</h1>
            <p class="text-muted">Encontre seu novo melhor amigo. Animais disponíveis em Campo Largo (ODS 15).</p>
        </header>

        <section class="mb-4 d-flex gap-2 flex-wrap" aria-label="Filtros de categoria">
            <button class="btn btn-outline-primary filter-btn px-4">Todas</button>
            <button class="btn btn-outline-primary filter-btn px-4">Cachorro</button>
            <button class="btn btn-outline-primary filter-btn px-4">Gato</button>
        </section>

        <section class="row g-3">
            {% for animal in animals %}
            <article class="col-md-6">
                <div class="card shadow-sm p-3">
                    <h2 class="h5 text-primary">{{ animal.name }}</h2>
                    <p class="mb-1 text-secondary">{{ animal.category }}, {{ animal.size }}</p>
                    <p class="fw-bold text-success mb-2">{{ animal.status }}</p>
                    <p class="small text-muted mb-0">{{ animal.details }}</p>
                </div>
            </article>
            {% endfor %}
        </section>
    </main>
</body>
</html>
