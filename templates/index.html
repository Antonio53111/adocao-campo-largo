<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feira de Adoção - Campo Largo</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">FEIRA DE ADOÇÃO CL</span>
            <span class="text-white">Voluntário</span>
        </div>
    </nav>

    <div class="container">
        <h2 class="mb-3">Encontre seu novo melhor amigo</h2>
        <p class="text-muted">Animais disponíveis em Campo Largo (ODS 15)</p>

        <!-- Filtros Rápidos (Acessibilidade: Toque mínimo 48x48px) -->
        <div class="mb-4">
            <button class="btn btn-dark btn-lg me-2 mb-2" style="min-height: 48px;">Todos</button>
            <button class="btn btn-outline-dark btn-lg me-2 mb-2" style="min-height: 48px;">Cachorro</button>
            <button class="btn btn-outline-dark btn-lg me-2 mb-2" style="min-height: 48px;">Gato</button>
        </div>

        <!-- Lista de Animais -->
        <div class="row">
            {% for pet in animais %}
            <div class="col-md-4 mb-3">
                <div class="card p-3 shadow-sm">
                    <h4>{{ pet.nome }}</h4>
                    <p class="text-muted">{{ pet.especie }}, {{ pet.porte }}</p>
                    <span class="badge bg-success mb-2 p-2" style="font-size: 1rem;">DISPONÍVEL</span>
                    <p class="small text-success">✔ Vacinado &nbsp; ✔ Castrado</p>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
